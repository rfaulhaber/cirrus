[package]
name = "cirrus-metadata"
version = "0.4.0"
description = "Salesforce Metadata API (SOAP) client for the Cirrus SDK."
keywords = ["salesforce", "metadata", "soap", "deploy", "retrieve"]
categories = ["api-bindings"]
readme = "README.md"
documentation = "https://docs.rs/cirrus-metadata"

edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
cirrus-auth.workspace = true
base64.workspace = true
bytes.workspace = true
getrandom.workspace = true
httpdate.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
dotenvy.workspace = true
flate2.workspace = true
proptest.workspace = true
serde_json.workspace = true
# `net` and `io-util` back the hand-rolled TCP server the transport
# tests use for a wire-level failure wiremock can't produce: a response
# body that stops mid-stream.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock.workspace = true
zip.workspace = true

[features]
default = ["rustls"]
# Each forwards the cirrus-auth feature of the same name, which is where
# the TLS choice is documented, and reqwest's, since this crate builds
# its own client.
rustls = ["cirrus-auth/rustls", "reqwest/rustls"]
rustls-no-provider = ["cirrus-auth/rustls-no-provider", "reqwest/rustls-no-provider"]
native-tls = ["cirrus-auth/native-tls", "reqwest/native-tls"]
native-tls-vendored = ["cirrus-auth/native-tls-vendored", "reqwest/native-tls-vendored"]
bundled-roots = ["cirrus-auth/bundled-roots"]

[lints]
workspace = true

[package.metadata.release]
allow-branch = ["main"]
sign-commit = true
sign-tag = true
push-remote = "origin"
tag-prefix = "cirrus-metadata-v"
tag-name = "{{prefix}}{{version}}"
publish = true
pre-release-replacements = [
    { file = "README.md", search = "cirrus-metadata = \"[^\"]+\"", replace = "cirrus-metadata = \"{{version}}\"", min = 1 },
    { file = "README.md", search = 'cirrus-metadata = \{ version = "[^"]+"', replace = 'cirrus-metadata = { version = "{{version}}"', min = 1 },
]
