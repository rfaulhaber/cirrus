[package]
name = "cirrus-metadata"
version = "0.2.0"
description = "Salesforce Metadata API (SOAP) client for the Cirrus SDK."
keywords = ["salesforce", "metadata", "soap", "deploy", "retrieve"]
categories = ["api-bindings"]
readme = "README.md"
documentation = "https://docs.rs/cirrus-metadata"

edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
cirrus-auth.workspace = true
base64.workspace = true
bytes.workspace = true
getrandom.workspace = true
httpdate.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
dotenvy.workspace = true
proptest.workspace = true
# `net` and `io-util` back the hand-rolled TCP server the transport
# tests use for a wire-level failure wiremock can't produce: a response
# body that stops mid-stream.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
url.workspace = true
wiremock.workspace = true
zip.workspace = true

[lints]
workspace = true

[package.metadata.release]
allow-branch = ["main"]
sign-commit = true
sign-tag = true
push-remote = "origin"
tag-prefix = "cirrus-metadata-v"
tag-name = "{{prefix}}{{version}}"
publish = true
