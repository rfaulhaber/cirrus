[package]
name = "cirrus-auth"
version = "0.4.2"
description = "Salesforce OAuth 2.0 authentication flows for the Cirrus SDK."
keywords = ["salesforce", "oauth", "auth", "jwt", "pkce"]
categories = ["authentication", "api-bindings"]
readme = "README.md"
documentation = "https://docs.rs/cirrus-auth"

edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
camino.workspace = true
fs-err.workspace = true
getrandom.workspace = true
jsonwebtoken.workspace = true
# `form` for the token-endpoint POST body; the token endpoint answers
# JSON, which serde_json parses from the collected bytes.
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `rt` on top of the workspace default (sync, time): the refresh flow
# spawns its token mint as a detached task so a cancelled caller cannot
# strand a rotated refresh token.
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
webpki-root-certs = { workspace = true, optional = true }

[features]
default = ["rustls"]
# The TLS backend, one of reqwest's by the same name. `rustls` is
# rustls with the aws-lc-rs provider and the platform verifier;
# `rustls-no-provider` leaves the crypto provider to the application,
# which must install one before building a client; the `native-tls`
# pair are the operating system's TLS stack (OpenSSL on Linux, built
# from source when vendored). Enabling both backends makes reqwest
# default to native-tls.
rustls = ["reqwest/rustls"]
rustls-no-provider = ["reqwest/rustls-no-provider"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
# Merge Mozilla's root set into the trust store of every client the
# crate builds, alongside the platform's, so a host with no system CA
# bundle can still build one. Presumes a TLS backend.
bundled-roots = ["dep:webpki-root-certs"]

[dev-dependencies]
dotenvy.workspace = true
flate2.workspace = true
# Test-only: decodes captured form bodies so assertions can read
# individual request parameters instead of substring-matching.
serde_urlencoded.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-core.workspace = true
wiremock.workspace = true

[lints]
workspace = true

[package.metadata.release]
allow-branch = ["main"]
sign-commit = true
sign-tag = true
push-remote = "origin"
# Crate-qualified tag prefix so cirrus-auth releases don't collide
# with `cirrus`'s existing `v{{version}}` tags (e.g. `v0.1.0`).
tag-prefix = "cirrus-auth-v"
tag-name = "{{prefix}}{{version}}"
publish = true
