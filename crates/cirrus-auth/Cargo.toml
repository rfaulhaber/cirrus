[package]
name = "cirrus-auth"
version = "0.3.2"
description = "Salesforce OAuth 2.0 authentication flows for the Cirrus SDK."
keywords = ["salesforce", "oauth", "auth", "jwt", "pkce"]
categories = ["authentication", "api-bindings"]
readme = "README.md"
documentation = "https://docs.rs/cirrus-auth"

edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
camino.workspace = true
fs-err.workspace = true
getrandom.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `rt` on top of the workspace default (sync, time): the refresh flow
# spawns its token mint as a detached task so a cancelled caller cannot
# strand a rotated refresh token.
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
dotenvy.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true

[package.metadata.release]
allow-branch = ["main"]
sign-commit = true
sign-tag = true
push-remote = "origin"
# Crate-qualified tag prefix so cirrus-auth releases don't collide
# with `cirrus`'s existing `v{{version}}` tags (e.g. `v0.1.0`).
tag-prefix = "cirrus-auth-v"
tag-name = "{{prefix}}{{version}}"
publish = true
