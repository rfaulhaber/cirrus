[package]
name = "cirrus"
version = "0.5.0"
description = "An ergonomic Rust HTTP client for the Salesforce REST API."
keywords = ["salesforce", "api", "client", "sdk", "rest"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"
documentation = "https://docs.rs/cirrus"

edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

exclude = [
    "/tests/integration",
    "/tests/integration.rs",
]

[dependencies]
cirrus-auth.workspace = true
bytes.workspace = true
futures.workspace = true
getrandom.workspace = true
http-serde.workspace = true
httpdate.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
dotenvy.workspace = true
proptest.workspace = true
wiremock.workspace = true
# `net` and `io-util` back the hand-rolled TCP servers the transport
# tests use for wire-level failures wiremock can't produce, such as a
# response body that stops mid-stream.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints]
workspace = true

[package.metadata.release]
allow-branch = ["main"]
sign-commit = true
sign-tag = true
push-remote = "origin"
tag-prefix = "v"
tag-name = "{{prefix}}{{version}}"
publish = true
pre-release-replacements = [
    { file = "README.md", search = "cirrus = \"[^\"]+\"", replace = "cirrus = \"{{version}}\"", min = 1 },
]
