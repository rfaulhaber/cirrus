[workspace]
resolver = "3"
members = ["crates/cirrus", "crates/cirrus-auth", "crates/cirrus-metadata"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ryan Faulhaber <ryf@sent.as>"]
repository = "https://github.com/cirrus-code/cirrus"
homepage = "https://github.com/cirrus-code/cirrus"

[workspace.dependencies]
# Workspace members. The `version` field is required so dependent
# crates can be published to crates.io — Cargo uses `path` for local
# workspace builds and `version` for the published manifest.
cirrus-auth = { path = "crates/cirrus-auth", version = "0.3.2" }
cirrus-metadata = { path = "crates/cirrus-metadata", version = "0.2.0" }

# Runtime / HTTP
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "query", "rustls", "charset", "system-proxy"] }
tokio = { version = "1.52", features = ["sync", "time"] }
url = "2.5"
bytes = "1.11"
http-serde = "2.1.1"
httpdate = "1"

# Serde stack
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
# 0.41+ required: RUSTSEC-2026-0195 (unbounded namespace-declaration
# allocation in NamespaceResolver::push) is fixed there.
quick-xml = { version = "0.41", features = ["serialize"] }

# Errors / async / utility
thiserror = "2.0"
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
camino = "1.2"
fs-err = "3.3"
getrandom = "0.4"
base64 = "0.23"
sha2 = "0.11"

# Auth
jsonwebtoken = { version = "11.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }

# Dev-only
dotenvy = "0.15"
proptest = "1.6"
wiremock = "0.6"
# `zip` is used only by integration tests that build a minimal deploy
# zip (cirrus-metadata). Pulling it into dev-dependencies keeps the
# published crate's dependency surface unchanged.
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
