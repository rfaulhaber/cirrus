name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only builds and tests the checked-out tree. Releases are
# published from a maintainer's machine via `cargo release`, so no job
# here needs a write-scoped GITHUB_TOKEN — and `actions/checkout`
# persists whatever token it gets into the workspace's git config,
# where third-party build scripts and proc macros can reach it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest run
        run: cargo nextest run --all-features --locked
      - name: cargo test --doc
        run: cargo test --doc --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN below duplicates `[workspace.package] rust-version` in
    # Cargo.toml — nothing reads the manifest here, so the two are coupled by
    # hand and have to be bumped together or this job checks the old floor and
    # still reports green. Setting it is not optional: rustup resolves
    # `rust-toolchain.toml` ahead of the default toolchain, so the repo's
    # `channel = "stable"` would otherwise silently win and the job would check
    # the declared floor against stable. RUSTUP_TOOLCHAIN outranks the
    # toolchain file.
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v6
      # The other jobs track stable, so nothing else notices when a dependency
      # bump raises the real floor above the declared one.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features --locked
