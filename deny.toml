# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# Schema version 2 — current as of cargo-deny 0.14+.

[graph]
all-features = true

[output]
feature-depth = 1

# -----------------------------------------------------------------------------
# Advisories — RUSTSEC vulnerability/unmaintained/yanked checks.
# -----------------------------------------------------------------------------
[advisories]
version = 2
yanked = "warn"
# Add advisory IDs here (e.g. "RUSTSEC-2024-0001") only with a justification
# comment. Prefer fixing/upgrading the dependency over ignoring.
ignore = []

# -----------------------------------------------------------------------------
# Licenses — allowlist. A transitive dep with an unlisted license fails CI,
# which is intentional: forces a conscious "is this license OK for us?" review.
# -----------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    # Linux Foundation's permissive data license. Used by `webpki-root-certs`
    # for Mozilla's CCADB root-CA bundle. Compatible with MIT/Apache projects.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    # Permissive, OSI-approved. Reaches the graph through `zlib-rs`, the
    # inflate backend behind reqwest's gzip response decompression.
    "Zlib",
]
# Per-crate license overrides go here when a crate has no SPDX-tagged license
# but is known to be permissively licensed.
exceptions = []

# -----------------------------------------------------------------------------
# Bans — duplicate versions, wildcard deps, etc.
# -----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Skip duplicate-version checks for crates where multi-versioning is unavoidable
# in the ecosystem.
skip = []
skip-tree = []

# -----------------------------------------------------------------------------
# Sources — only crates.io is trusted by default. Add git sources here if the
# project ever pulls a dep from a git URL.
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
